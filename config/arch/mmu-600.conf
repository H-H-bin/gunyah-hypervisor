base_arch smmuv3

# For MMU-600 implemention defined options
configs SMMU_V3_HAS_MMU_600=1

# ARM HW IDs
# ARM (JEP106 code: [0x4] 0x3b)
configs SMMU_V3_IMPLEMENTER=0x43BU
# ARM IDs for MMU-600
configs SMMU_V3_PRODUCT_ID=0x483U

# MMU-600 supports SMMUv3.1
configs SMMU_V3_MAJOR_REV=0x0U
configs SMMU_V3_MINOR_REV=0x1U
